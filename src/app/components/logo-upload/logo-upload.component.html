<div 
  class="upload-dropzone" 
  [class.dragging]="isDragging"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
  id="logo-dropzone"
  role="region"
  aria-label="Logo Upload Drop Zone"
>
  <input 
    type="file" 
    id="logo-file-input" 
    class="file-input-hidden" 
    accept=".jpg,.jpeg,.png,image/jpeg,image/png"
    (change)="onFileInput($event)"
    aria-label="Upload logo file"
  />

  <div class="dropzone-content">
    <div class="upload-icon-wrapper" aria-hidden="true">
      <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
    </div>

    <div class="text-group">
      <h3 class="dropzone-title">Upload a logo to extract brand palette</h3>
      <p class="dropzone-subtitle">Drag and drop your logo here, or browse from your device</p>
    </div>

    <label for="logo-file-input" class="browse-button" tabindex="0" (keydown.enter)="$any($event.target).click()" (keydown.space)="$any($event.target).click()">
      <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l5-5a1 1 0 011.414 0l5 5a1 1 0 01-1.414 1.414L13 3.414V13a1 1 0 11-2 0V3.414L7.707 6.707a1 1 0 01-1.414 0z" clip-rule="evenodd" />
      </svg>
      <span>Browse Files</span>
    </label>

    <div class="format-badges">
      <span class="badge">JPG / JPEG</span>
      <span class="badge">PNG</span>
      <span class="badge-subtle">Max 5 MB</span>
    </div>
  </div>
</div>
